<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Nhạc Vui – Cập nhật</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding: 20px;
            background: #fce4ec;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(145deg, #fce4ec, #f8e8ff, #fce4ec);
            background-size: 300% 300%;
            animation: gradientSoft 12s ease infinite;
            pointer-events: none;
        }

        @keyframes gradientSoft {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 0 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            padding: 24px 20px 18px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(233, 30, 99, 0.06);
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            color: #880e4f;
        }

        .header h1 i {
            color: #e91e63;
            margin: 0 6px;
        }

        .header .sub {
            font-size: 1rem;
            font-weight: 700;
            color: #ad1457;
            opacity: 0.75;
            margin-top: 4px;
        }

        .header .actions {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            background: #e91e63;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 18px rgba(233, 30, 99, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(233, 30, 99, 0.3);
        }

        .btn-secondary {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            padding: 10px 22px;
            border: 1.5px solid rgba(233, 30, 99, 0.15);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            color: #880e4f;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
        }

        .post-form {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px 28px 28px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.03);
            display: none;
        }

        .post-form.open {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-form .form-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #880e4f;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 0.9rem;
            color: #880e4f;
            opacity: 0.7;
            display: block;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group textarea {
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            width: 100%;
            padding: 12px 18px;
            border-radius: 24px;
            border: 1.5px solid rgba(233, 30, 99, 0.08);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            color: #1a1a2e;
            transition: border 0.25s, box-shadow 0.25s;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #e91e63;
            box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.06);
            background: rgba(255, 255, 255, 0.8);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .file-upload-wrapper input[type="file"] {
            flex: 1 1 200px;
            padding: 10px;
            border: 1.5px dashed rgba(233, 30, 99, 0.15);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.3);
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            color: #880e4f;
        }

        .file-upload-wrapper .file-name {
            font-weight: 700;
            color: #880e4f;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .file-upload-wrapper .remove-file-btn {
            background: none;
            border: none;
            color: #e91e63;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 30px;
            transition: background 0.2s;
        }

        .file-upload-wrapper .remove-file-btn:hover {
            background: rgba(233, 30, 99, 0.04);
        }

        .btn-submit {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            padding: 14px 32px;
            border: none;
            border-radius: 40px;
            background: #e91e63;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.15);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(233, 30, 99, 0.25);
        }

        .cancel-form-btn {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            padding: 10px 24px;
            border: 1.5px solid rgba(233, 30, 99, 0.1);
            border-radius: 40px;
            background: transparent;
            color: #880e4f;
            font-size: 0.95rem;
            cursor: pointer;
            margin-left: 12px;
            transition: background 0.2s;
        }

        .cancel-form-btn:hover {
            background: rgba(233, 30, 99, 0.04);
        }

        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .post-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px 28px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.04);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #1a1a2e;
            line-height: 1.3;
        }

        .post-title i {
            color: #e91e63;
            margin-right: 8px;
        }

        .post-date {
            font-weight: 700;
            color: #880e4f;
            opacity: 0.5;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 16px;
            border-radius: 30px;
            white-space: nowrap;
        }

        .post-content {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #2c2c3e;
            margin: 12px 0 16px;
            white-space: pre-line;
            word-break: break-word;
        }

        .post-image {
            margin: 12px 0 16px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .post-image img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            display: block;
        }

        .post-audio {
            margin: 12px 0 16px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .post-audio audio {
            flex: 1 1 200px;
            min-width: 180px;
            border-radius: 30px;
        }

        .post-audio .audio-name {
            font-weight: 700;
            color: #880e4f;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            border-top: 1.5px solid rgba(233, 30, 99, 0.06);
            padding-top: 16px;
            margin-top: 4px;
        }

        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #e91e63;
            background: transparent;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1.5px solid rgba(233, 30, 99, 0.08);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .like-btn:hover {
            background: rgba(233, 30, 99, 0.04);
            transform: scale(1.03);
        }

        .like-btn i {
            font-size: 1.2rem;
        }

        .like-count {
            font-weight: 800;
            min-width: 20px;
        }

        .comment-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #880e4f;
            background: transparent;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1.5px solid rgba(136, 14, 79, 0.06);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            font-size: 0.95rem;
        }

        .comment-toggle:hover {
            background: rgba(136, 14, 79, 0.04);
            transform: scale(1.03);
        }

        .comment-count {
            font-weight: 800;
        }

        .delete-post-btn {
            background: none;
            border: none;
            color: #e91e63;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.2s;
            padding: 4px 8px;
            border-radius: 30px;
        }

        .delete-post-btn:hover {
            opacity: 0.8;
            transform: scale(1.08);
        }

        .post-header .right-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .comment-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1.5px dashed rgba(233, 30, 99, 0.06);
            display: none;
        }

        .comment-section.open {
            display: block;
            animation: fadeSlide 0.25s ease;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 10px 16px;
            border-left: 3px solid #e91e63;
        }

        .comment-item .comment-author {
            font-weight: 800;
            color: #880e4f;
            font-size: 0.85rem;
        }

        .comment-item .comment-author i {
            margin-right: 6px;
            color: #e91e63;
        }

        .comment-item .comment-text {
            color: #1a1a2e;
            margin-top: 2px;
            font-weight: 600;
            word-break: break-word;
        }

        .comment-item .comment-time {
            font-size: 0.7rem;
            color: #880e4f;
            opacity: 0.4;
            margin-top: 4px;
        }

        .comment-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .comment-form input {
            flex: 1 1 160px;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1.5px solid rgba(233, 30, 99, 0.06);
            background: rgba(255, 255, 255, 0.4);
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
            font-size: 0.9rem;
        }

        .comment-form input:focus {
            border-color: #e91e63;
            box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.03);
        }

        .comment-form button {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            background: #e91e63;
            color: #fff;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 0.9rem;
            box-shadow: 0 4px 16px rgba(233, 30, 99, 0.08);
        }

        .comment-form button:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(233, 30, 99, 0.15);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .empty-state .big-emoji {
            font-size: 3.8rem;
            display: block;
            margin-bottom: 12px;
            color: #e91e63;
        }

        .empty-state p {
            font-weight: 700;
            color: #880e4f;
            opacity: 0.5;
            font-size: 1.2rem;
        }

        .empty-state .sub-text {
            font-weight: 600;
            color: #880e4f;
            opacity: 0.3;
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(136, 14, 79, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 999;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .post-title {
                font-size: 1.25rem;
            }
            .post-card {
                padding: 18px 16px;
            }
            .comment-form {
                flex-direction: column;
                align-items: stretch;
            }
            .comment-form input {
                flex: 1 1 auto;
            }
            .btn-primary,
            .btn-secondary {
                font-size: 0.9rem;
                padding: 8px 18px;
            }
            .post-form {
                padding: 18px 16px;
            }
            .post-actions {
                gap: 14px;
            }
            .like-btn,
            .comment-toggle {
                font-size: 0.85rem;
                padding: 4px 12px;
            }
            .post-image img {
                max-height: 240px;
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #e91e63;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="toast" id="toast">✨ Thành công!</div>

    <div class="container">

        <header class="header">
            <h1><i class="fas fa-headphones"></i> Nhạc Vui <i class="fas fa-music"></i></h1>
            <div class="sub">🎵 Cập nhật tính năng &amp; tin tức về web nghe nhạc</div>
            <div class="actions">
                <button class="btn-primary" id="toggleFormBtn"><i class="fas fa-pen"></i> Đăng bài</button>
                <button class="btn-secondary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Làm mới</button>
            </div>
        </header>

        <!-- FORM ĐĂNG BÀI (có upload ảnh + nhạc) -->
        <div class="post-form" id="postForm">
            <div class="form-title"><i class="fas fa-feather-alt"></i> Viết bài cập nhật</div>
            <form id="newPostForm">
                <div class="form-group">
                    <label for="postTitle">📌 Tiêu đề</label>
                    <input type="text" id="postTitle" placeholder="VD: Thêm tính năng phát nhạc theo mood" required />
                </div>
                <div class="form-group">
                    <label for="postContent">📝 Nội dung</label>
                    <textarea id="postContent" placeholder="Mô tả chi tiết bản cập nhật..." rows="4" required></textarea>
                </div>

                <!-- Upload ảnh -->
                <div class="form-group">
                    <label>🖼️ Tải ảnh lên (tùy chọn, tối đa 2MB)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="imageFileInput" accept="image/*" />
                        <span class="file-name" id="imageFileNameDisplay">Chưa có ảnh</span>
                        <button type="button" class="remove-file-btn" id="removeImageBtn">✕ Xóa</button>
                    </div>
                </div>

                <!-- Upload nhạc -->
                <div class="form-group">
                    <label>🎵 Tải file nhạc lên (tùy chọn, tối đa 2MB)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="audioFileInput" accept="audio/*" />
                        <span class="file-name" id="audioFileNameDisplay">Chưa có nhạc</span>
                        <button type="button" class="remove-file-btn" id="removeAudioBtn">✕ Xóa</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Đăng ngay</button>
                <button type="button" class="cancel-form-btn" id="cancelFormBtn">Hủy</button>
            </form>
        </div>

        <!-- DANH SÁCH BÀI VIẾT -->
        <div class="posts-container" id="postsContainer"></div>

    </div>

    <script>
        // ============================================================
        //  DATA & STORAGE
        // ============================================================
        const STORAGE_KEY = 'music_blog_posts';
        let posts = [];

        // Biến tạm lưu file ảnh và nhạc đã chọn
        let selectedImageData = null;
        let selectedImageName = '';
        let selectedAudioData = null;
        let selectedAudioName = '';

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length) {
                        posts = parsed;
                        return;
                    }
                }
            } catch (_) {}

            // Mẫu dữ liệu ban đầu
            posts = [{
                id: Date.now() - 86400000 * 3,
                title: '🎧 Giao diện mới',
                content: 'Chào mừng đến với phiên bản cập nhật giao diện! Màu sắc được làm dịu hơn, bố cục tối giản.',
                date: getDateString(-3),
                likes: 9,
                comments: [
                    { author: 'Minh Anh', text: 'Rất đẹp và thanh lịch!', time: Date.now() - 3600000 * 3 }
                ],
                imageData: null,
                imageName: null,
                audioData: null,
                audioName: null
            }, {
                id: Date.now() - 86400000 * 1,
                title: '🎵 Phát nhạc theo tâm trạng',
                content: 'Tính năng mới: chọn playlist theo mood (Vui, Chill, Buồn, Sôi động).',
                date: getDateString(-1),
                likes: 6,
                comments: [
                    { author: 'Thu Thảo', text: 'Tuyệt vời! Mình rất thích.', time: Date.now() - 3600000 * 2 }
                ],
                imageData: null,
                imageName: null,
                audioData: null,
                audioName: null
            }];
            saveToStorage();
        }

        function getDateString(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().slice(0, 10);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function generateId() {
            return Date.now() + Math.random() * 1000;
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderAll() {
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="big-emoji">🎵</span>
                        <p>Chưa có bài viết</p>
                        <div class="sub-text">Hãy là người đầu tiên đăng cập nhật 🌟</div>
                    </div>
                `;
                return;
            }

            const sorted = [...posts].sort((a, b) => {
                if (a.date > b.date) return -1;
                if (a.date < b.date) return 1;
                return b.id - a.id;
            });

            let html = '';
            for (const post of sorted) {
                const likeCount = post.likes || 0;
                const commentCount = Array.isArray(post.comments) ? post.comments.length : 0;

                // Ảnh
                let imageHtml = '';
                if (post.imageData) {
                    imageHtml = `
                        <div class="post-image">
                            <img src="${post.imageData}" alt="${escapeHtml(post.imageName || 'Ảnh')}" loading="lazy" />
                        </div>
                    `;
                }

                // Nhạc
                let audioHtml = '';
                if (post.audioData) {
                    audioHtml = `
                        <div class="post-audio">
                            <audio controls src="${post.audioData}"></audio>
                            <span class="audio-name"><i class="fas fa-music"></i> ${escapeHtml(post.audioName || 'Audio')}</span>
                        </div>
                    `;
                }

                html += `
                    <div class="post-card" data-id="${post.id}">
                        <div class="post-header">
                            <div class="post-title">${escapeHtml(post.title) || '📌 Bài viết'}</div>
                            <div class="right-actions">
                                <span class="post-date"><i class="far fa-calendar-alt"></i> ${formatDate(post.date)}</span>
                                <button class="delete-post-btn" data-id="${post.id}" title="Xóa"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                        <div class="post-content">${escapeHtml(post.content) || '📝 Không có nội dung.'}</div>
                        ${imageHtml}
                        ${audioHtml}
                        <div class="post-actions">
                            <div class="like-btn" data-id="${post.id}">
                                <i class="fas fa-heart"></i>
                                <span class="like-count">${likeCount}</span>
                            </div>
                            <div class="comment-toggle" data-id="${post.id}">
                                <i class="fas fa-comment"></i>
                                <span class="comment-count">${commentCount}</span> bình luận
                            </div>
                        </div>

                        <!-- Comment section -->
                        <div class="comment-section" data-id="${post.id}">
                            <div class="comment-list" id="commentList-${post.id}">
                                ${renderComments(post)}
                            </div>
                            <div class="comment-form" data-id="${post.id}">
                                <input type="text" class="comment-input" placeholder="Viết bình luận..." />
                                <button class="comment-submit" data-id="${post.id}"><i class="fas fa-paper-plane"></i> Gửi</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            attachPostEvents();
        }

        function renderComments(post) {
            if (!Array.isArray(post.comments) || post.comments.length === 0) {
                return `<div style="color:#880e4f; opacity:0.3; font-weight:600; padding:8px 0;">Chưa có bình luận nào.</div>`;
            }
            let html = '';
            for (const c of post.comments) {
                const timeStr = c.time ? new Date(c.time).toLocaleString('vi-VN') : '';
                html += `
                    <div class="comment-item">
                        <div class="comment-author"><i class="fas fa-user-circle"></i> ${escapeHtml(c.author || 'Ẩn danh')}</div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                        <div class="comment-time">${timeStr}</div>
                    </div>
                `;
            }
            return html;
        }

        // ============================================================
        //  EVENTS
        // ============================================================
        function attachPostEvents() {
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = Number(this.dataset.id);
                    handleLike(id);
                });
            });

            document.querySelectorAll('.comment-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = Number(this.dataset.id);
                    const section = document.querySelector(`.comment-section[data-id="${id}"]`);
                    if (section) section.classList.toggle('open');
                });
            });

            document.querySelectorAll('.comment-submit').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = Number(this.dataset.id);
                    const input = document.querySelector(`.comment-form[data-id="${id}"] .comment-input`);
                    if (input && input.value.trim()) {
                        handleComment(id, input.value.trim());
                        input.value = '';
                    } else {
                        showToast('😊 Vui lòng nhập nội dung!');
                    }
                });
            });

            document.querySelectorAll('.comment-input').forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const id = Number(this.closest('.comment-form').dataset.id);
                        const input = this;
                        if (input.value.trim()) {
                            handleComment(id, input.value.trim());
                            input.value = '';
                        } else {
                            showToast('😊 Vui lòng nhập nội dung!');
                        }
                    }
                });
            });

            document.querySelectorAll('.delete-post-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = Number(this.dataset.id);
                    if (confirm('Bạn có chắc xóa bài này không?')) {
                        deletePost(id);
                    }
                });
            });
        }

        // ============================================================
        //  CRUD
        // ============================================================
        function handleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            post.likes = (post.likes || 0) + 1;
            saveToStorage();
            renderAll();
            showToast('💖 Đã thả tim!');
        }

        function handleComment(postId, text) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            if (!Array.isArray(post.comments)) post.comments = [];
            post.comments.push({
                author: 'Bạn',
                text: text,
                time: Date.now()
            });
            saveToStorage();
            renderAll();
            const section = document.querySelector(`.comment-section[data-id="${postId}"]`);
            if (section) section.classList.add('open');
            showToast('💬 Đã bình luận!');
        }

        function deletePost(postId) {
            posts = posts.filter(p => p.id !== postId);
            saveToStorage();
            renderAll();
            showToast('🗑️ Đã xóa bài.');
        }

        function addPost(title, content, imageData, imageName, audioData, audioName) {
            const newPost = {
                id: generateId(),
                title: title.trim(),
                content: content.trim(),
                date: getDateString(0),
                likes: 0,
                comments: [],
                imageData: imageData || null,
                imageName: imageName || null,
                audioData: audioData || null,
                audioName: audioName || null
            };
            posts.push(newPost);
            saveToStorage();
            renderAll();
            showToast('🎉 Đã đăng bài mới!');
        }

        // ============================================================
        //  FILE UPLOAD HANDLING (Ảnh + Nhạc)
        // ============================================================

        // --- ẢNH ---
        const imageInput = document.getElementById('imageFileInput');
        const imageNameDisplay = document.getElementById('imageFileNameDisplay');
        const removeImageBtn = document.getElementById('removeImageBtn');

        imageInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) {
                resetImageSelection();
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                showToast('⚠️ Ảnh quá lớn! Vui lòng chọn file dưới 2MB.');
                this.value = '';
                resetImageSelection();
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedImageData = event.target.result;
                selectedImageName = file.name;
                imageNameDisplay.textContent = file.name;
                showToast('✅ Đã chọn ảnh: ' + file.name);
            };
            reader.readAsDataURL(file);
        });

        removeImageBtn.addEventListener('click', function() {
            imageInput.value = '';
            resetImageSelection();
        });

        function resetImageSelection() {
            selectedImageData = null;
            selectedImageName = '';
            imageNameDisplay.textContent = 'Chưa có ảnh';
        }

        // --- NHẠC ---
        const audioInput = document.getElementById('audioFileInput');
        const audioNameDisplay = document.getElementById('audioFileNameDisplay');
        const removeAudioBtn = document.getElementById('removeAudioBtn');

        audioInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) {
                resetAudioSelection();
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                showToast('⚠️ File nhạc quá lớn! Vui lòng chọn file dưới 2MB.');
                this.value = '';
                resetAudioSelection();
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedAudioData = event.target.result;
                selectedAudioName = file.name;
                audioNameDisplay.textContent = file.name;
                showToast('✅ Đã chọn nhạc: ' + file.name);
            };
            reader.readAsDataURL(file);
        });

        removeAudioBtn.addEventListener('click', function() {
            audioInput.value = '';
            resetAudioSelection();
        });

        function resetAudioSelection() {
            selectedAudioData = null;
            selectedAudioName = '';
            audioNameDisplay.textContent = 'Chưa có nhạc';
        }

        // ============================================================
        //  FORM HANDLING
        // ============================================================
        const form = document.getElementById('postForm');
        const toggleBtn = document.getElementById('toggleFormBtn');
        const cancelBtn = document.getElementById('cancelFormBtn');

        toggleBtn.addEventListener('click', function() {
            form.classList.toggle('open');
            if (form.classList.contains('open')) {
                document.getElementById('postTitle').focus();
            }
        });

        cancelBtn.addEventListener('click', function() {
            form.classList.remove('open');
            resetImageSelection();
            resetAudioSelection();
            imageInput.value = '';
            audioInput.value = '';
        });

        document.getElementById('newPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title) {
                showToast('😅 Vui lòng nhập tiêu đề!');
                return;
            }
            if (!content) {
                showToast('😅 Vui lòng nhập nội dung!');
                return;
            }

            addPost(
                title,
                content,
                selectedImageData,
                selectedImageName,
                selectedAudioData,
                selectedAudioName
            );

            // Reset form
            this.reset();
            resetImageSelection();
            resetAudioSelection();
            imageInput.value = '';
            audioInput.value = '';
            form.classList.remove('open');
        });

        // ============================================================
        //  REFRESH
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadFromStorage();
            renderAll();
            showToast('🔄 Đã làm mới!');
        });

        // ============================================================
        //  TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(message) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, 2200);
        }

        // ============================================================
        //  ESCAPE
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  INIT
        // ============================================================
        loadFromStorage();
        renderAll();

        if (posts.length === 0) {
            setTimeout(() => {
                form.classList.add('open');
                document.getElementById('postTitle').focus();
            }, 400);
        }

        console.log('🎵 Music Blog – đã hỗ trợ upload ảnh và nhạc!');
    </script>

</body>
</html>
